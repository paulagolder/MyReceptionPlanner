# Builds the MyReceptionPlanner installers, each with its own Java: a .deb
# for Linux and an .msi for Windows (each built on its own system; the .msi
# needs the WiX Toolset 3, on GitHub's Windows images or else from Chocolatey).
#
#  - Pushing a version tag builds the Linux installer and puts it on a
#    release page:
#        git tag v1.0.0 && git push origin v1.0.0
#  - Windows only by choice, as it costs twice the minutes: "Run workflow" on
#    the repository's Actions page, tick Windows (and Linux or not). Run it
#    from a tag ("Use workflow from", Tags) to add the files to that tag's
#    release page; from main, download them from the run's page (Artifacts),
#    kept for 2 days.
name: Package

on:
  workflow_dispatch:
    inputs:
      linux:
        description: Linux (.deb)
        type: boolean
        default: true
      windows:
        description: Windows (.msi)
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write   # to create the release

jobs:
  package:
    if: github.event_name == 'push' || inputs.linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Version (from the tag, e.g. v1.2.0)
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then v="${GITHUB_REF_NAME#v}"; else v=1.0.0; fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"

      - name: Tests
        run: xvfb-run ./gradlew test

      - name: Linux installer
        run: ./gradlew packageApp -PappVersion=$APP_VERSION

      - uses: actions/upload-artifact@v7
        with:
          retention-days: 2   # the release page keeps the files; this copy only to download a trial build
          name: MyReceptionPlanner-Linux
          path: build/package/*
      - name: Release page
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/package/*

  windows:
    needs: package   # after Linux, which makes the release page this adds to
    if: ${{ !failure() && !cancelled() && inputs.windows }}   # only when chosen, Linux built or not
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: WiX Toolset 3 (jpackage makes the .msi with it)
        run: |
          # GitHub's Windows images usually have it already
          if (-not (Test-Path "C:\Program Files (x86)\WiX Toolset v3.14\bin\candle.exe")) {
            choco install wixtoolset -y --no-progress
          }
          echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" >> $env:GITHUB_PATH

      - name: Version (from the tag, e.g. v1.2.0)
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then v="${GITHUB_REF_NAME#v}"; else v=1.0.0; fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"

      - name: Windows installer
        shell: bash
        run: ./gradlew packageApp -PappVersion=$APP_VERSION

      - uses: actions/upload-artifact@v7
        with:
          retention-days: 2   # the release page keeps the files; this copy only to download a trial build
          name: MyReceptionPlanner-Windows
          path: build/package/*
      - name: Release page
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/package/*
